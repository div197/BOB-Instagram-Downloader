<!doctype html><html lang="en"><head><meta charset="utf-8"><title>BOB — Download</title>
<style>body{margin:0;font-family:system-ui;width:320px;padding:16px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:600;cursor:pointer}</style></head>
<body><h2 style="margin:0 0 8px">BOB Downloader</h2><p style="color:#666;font-size:13px">Public reels/posts you can already view. Paste a link:</p>
<input id="u" placeholder="https://www.instagram.com/reel/..." value=""><button id="go">Fetch</button><p id="s" style="font-size:13px"></p>
<script>
  // Popup → SW path (same as content-script, single source: background.js)
  const s = document.getElementById("s");
  document.getElementById("go").onclick = async () => {
    const url = document.getElementById("u").value.trim();
    s.textContent = "Fetching…";
    // In popup context, ask SW to extract, then open returned CDN URL(s)
    const res = await chrome.runtime.sendMessage({ type: "BOB_EXTRACT", url });
    s.textContent = res?.ok ? "Opening download…" : ("Error: " + (res?.code || "failed"));
    const cdn = res?.media?.media?.[0]?.video_url || res?.media?.media?.[0]?.thumbnail;
    if (cdn) chrome.downloads.download({ url: cdn, saveAs: false });
  };
</script></body></html>
