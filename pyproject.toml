[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bob-extractor"
version = "0.1.0"
description = "BOB Instagram Downloader — public-only extractor kernel (roots of the upside-down tree)"
requires-python = ">=3.11"
dependencies = ["yt-dlp>=2026.1", "curl-cffi>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
